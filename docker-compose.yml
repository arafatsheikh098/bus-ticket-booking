name: aashon

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aashon
      POSTGRES_PASSWORD: aashon
      POSTGRES_DB: aashon
    ports:
      - "127.0.0.1:5433:5432"   # Only this machine can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aashon"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://aashon:aashon@db:5432/aashon
      FAKEPAY_URL: http://fakepay:8001
      FAKEPAY_API_KEY: ${FAKEPAY_API_KEY:-sk_test_dev_change_me}
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:-whsec_dev_change_me}
      CALLBACK_BASE_URL: http://api:8000
      WEB_URL: http://localhost:8080
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      PAYMENT_GRACE_SECONDS: ${PAYMENT_GRACE_SECONDS:-120}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
      # Trust X-Forwarded-For from nginx so rate limits see the real client address.
      # Safe because port 8000 is published on 127.0.0.1 only.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  fakepay:
    build: ./fakepay
    environment:
      FAKEPAY_API_KEY: ${FAKEPAY_API_KEY:-sk_test_dev_change_me}
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:-whsec_dev_change_me}
      FAKEPAY_PUBLIC_URL: http://localhost:8001
    ports:
      - "127.0.0.1:8001:8001"

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
